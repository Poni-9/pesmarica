name: Piano regression tests
on:
  push:
    paths: ['index.html', 'piano.js', 'sw.js', 'tests/**', '.github/workflows/piano-test.yml']
  pull_request:
    paths: ['index.html', 'piano.js', 'sw.js', 'tests/**', '.github/workflows/piano-test.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/piano.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piano-screenshots
          path: /tmp/piano-*.png
